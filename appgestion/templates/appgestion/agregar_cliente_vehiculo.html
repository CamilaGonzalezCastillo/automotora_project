<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Cliente y Vehículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-3 text-primary">Agregar Cliente y Vehículo</h3>
            <form method="POST" action="{% url 'agregar_cliente_vehiculo' %}">
                {% csrf_token %}
                <h5 class="mt-2">Datos del Cliente</h5>
                <div class="mb-2">
                    <label class="form-label">RUT:</label>
                    <input type="text" name="txt_rut" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Nombre:</label>
                    <input type="text" name="txt_nombre" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Apellidos:</label>
                    <input type="text" name="txt_apellidos" class="form-control" required>
                </div>

                <h5 class="mt-3">Datos del Vehículo</h5>
                <div class="mb-2">
                    <label class="form-label">Marca:</label>
                    <input type="text" name="txt_marca" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Modelo:</label>
                    <input type="text" name="txt_modelo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Año:</label>
                    <input type="number" name="txt_anio" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Guardar</button>
            </form>
            <br>
            <a href="{% url 'menu_principal' %}" class="btn btn-secondary">Volver al Menú</a>
        </div>
    </div>
</body>
</html>
