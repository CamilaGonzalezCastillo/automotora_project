<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Vehículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <div class="card p-4 shadow-sm">
            <h3 class="text-danger mb-3">Eliminar Vehículo de un Cliente</h3>
            <form method="POST" action="{% url 'eliminar_vehiculo' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Seleccione el Vehículo:</label>
                    <select name="txt_id_vehiculo" class="form-select" required>
                        <option value="">Seleccione vehículo a eliminar...</option>
                        {% for auto in vehiculos %}
                            <option value="{{ auto.id_vehiculo }}">
                                ID {{ auto.id_vehiculo }} - {{ auto.marca }} {{ auto.modelo }} (Dueño: {{ auto.cliente.nombre }} {{ auto.cliente.apellidos }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-danger w-100" onclick="return confirm('¿Confirma que desea eliminar este vehículo?');">Eliminar Vehículo</button>
            </form>
            <br>
            <a href="{% url 'menu_principal' %}" class="btn btn-secondary">Volver al Menú</a>
        </div>
    </div>
</body>
</html>
