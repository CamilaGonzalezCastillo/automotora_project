<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Vehículo Vendido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 550px;">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-3 text-success">Registrar Venta de Vehículo</h3>
            <form method="POST" action="{% url 'agregar_vehiculo_vendido' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Vehículo:</label>
                    <select name="opt_vehiculo" class="form-select" required>
                        <option value="">Seleccione vehículo...</option>
                        {% for auto in vehiculos %}
                            <option value="{{ auto.id_vehiculo }}">{{ auto.marca }} {{ auto.modelo }} (Dueño actual: {{ auto.cliente.nombre }} {{ auto.cliente.apellidos }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha de Venta:</label>
                    <input type="date" name="txt_fecha" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio de Venta:</label>
                    <input type="number" step="0.01" name="txt_precio" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre del Comprador:</label>
                    <input type="text" name="txt_comprador" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Guardar Venta</button>
            </form>
            <br>
            <a href="{% url 'menu_principal' %}" class="btn btn-secondary">Volver al Menú</a>
        </div>
    </div>
</body>
</html>
