{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Automotora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-3">
            <div class="d-flex justify-content-center mb-3">
    <div style="width: 170px; height: 170px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
        <img src="{% static 'appgestion/img/logo_auto.jpg' %}" alt="Logo Automotora" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.45);">
    </div>
</div>
            <h3 class="fw-bold">Acceso Automotora</h3>
            <p class="text-muted small">Ingresa tus credenciales registradas</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">RUT del Usuario</label>
                <input type="text" name="txt_rut" class="form-control" placeholder="Ej: 11.222.333-4" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="txt_clave" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
